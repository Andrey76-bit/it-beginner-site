<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты — IT Start</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            margin: 0;
        }

        header {
            text-align: center;
            padding: 40px 20px 20px;
        }

        header h1 {
            color: #4fc3f7;
            font-size: 42px;
            margin: 0 0 15px;
        }

        .main-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
        }

        .main-nav a {
            color: #e0e0e0;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 6px;
            transition: background 0.3s;
            font-size: 15px;
        }

        .main-nav a:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .contacts-section {
            max-width: 600px;
            margin: 30px auto;
            padding: 25px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .contacts-section h2 {
            color: #4fc3f7;
            margin-bottom: 20px;
            text-align: center;
            font-size: 24px;
        }

        .contacts-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .contacts-list li {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 16px;
        }

        .contacts-list li:last-child {
            border-bottom: none;
        }

        .contact-icon {
            font-size: 22px;
            width: 30px;
            text-align: center;
            flex-shrink: 0;
        }

        .contact-label {
            color: #9e9e9e;
            min-width: 100px;
            flex-shrink: 0;
        }

        .contacts-list a {
            color: #4fc3f7;
            text-decoration: none;
            transition: color 0.3s;
            word-break: break-all;
        }

        .contacts-list a:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            color: #9e9e9e;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 32px;
            }
            .main-nav {
                flex-direction: column;
                align-items: center;
                gap: 8px;
            }
            .contacts-section {
                margin: 20px 15px;
                padding: 20px;
            }
            .contacts-list li {
                flex-wrap: wrap;
                gap: 6px;
            }
            .contact-label {
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Контакты</h1>
        <nav class="main-nav">
            <a href="index.html">На главную</a>
            <a href="contacts.html">Контакты</a>
        </nav>
    </header>

    <main>
        <section class="contacts-section">
            <h2>Свяжитесь со мной</h2>
            <ul class="contacts-list">
                <li>
                    <span class="contact-icon">📱</span>
                    <span class="contact-label">Телефон:</span>
                    <a href="tel:+79785791200">+7 978 579-12-00</a>
                </li>
                <li>
                    <span class="contact-icon">✉️</span>
                    <span class="contact-label">Email:</span>
                    <a href="mailto:nata37971@gmail.com">nata37971@gmail.com</a>
                </li>
                <li>
                    <span class="contact-icon">💬</span>
                    <span class="contact-label">Telegram:</span>
                    <a href="https://t.me/Andrey20Andre" target="_blank">@Andrey20Andre</a>
                </li>
                <li>
                    <span class="contact-icon">🟣</span>
                    <span class="contact-label">MAX:</span>
                    <a href="tel:+79782080899">+7 978 208-08-99 (Петрович)</a>
                </li>
            </ul>
        </section>
    </main>

    <footer>
        <p>Сделано с душой для начинающих айтишников</p>
    </footer>
</body>
</html>
